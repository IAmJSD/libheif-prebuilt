name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach the built artifacts to (draft release)"
        required: false
        default: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04        # oldest glibc we support
            artifact: linux-x86_64
          - os: ubuntu-22.04-arm
            artifact: linux-aarch64
          - os: macos-14
            artifact: macos-aarch64
          - os: macos-15-intel
            artifact: macos-x86_64
          - os: windows-2022
            artifact: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh dist
        shell: bash
      - run: ls -la dist && (shasum -a 256 dist/* 2>/dev/null || sha256sum dist/*)
        shell: bash
      # Only the library: license texts come from the release job's
      # checkout, so Windows's CRLF-converted copies never race the
      # LF ones whose hashes schist pins.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/libheif-*

  release:
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # License texts plus the complete corresponding source for the
      # LGPL-3.0 artifacts.
      - run: |
          cp vendor/libheif-1.23.2/COPYING dist/COPYING-libheif.txt
          cp vendor/libde265-1.1.1/COPYING dist/COPYING-libde265.txt
          tar czf dist/libde265-1.1.1-src.tar.gz -C vendor libde265-1.1.1
          tar czf dist/libheif-1.23.2-src.tar.gz -C vendor libheif-1.23.2
          sha256sum dist/*
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true
          files: dist/*
